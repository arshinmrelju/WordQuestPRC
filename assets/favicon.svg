<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#d97706"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect x="2" y="2" width="60" height="60" rx="12" ry="12" fill="url(#bg)"/>

  <!-- Gold border -->
  <rect x="2" y="2" width="60" height="60" rx="12" ry="12"
        fill="none" stroke="url(#border-grad)" stroke-width="2.5"/>

  <!-- W — white -->
  <text x="10" y="44"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="30"
        font-weight="900"
        fill="#ffffff"
        letter-spacing="-1">W</text>

  <!-- Q — gold -->
  <text x="35" y="44"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="30"
        font-weight="900"
        fill="#f59e0b"
        letter-spacing="-1">Q</text>

  <!-- subtle inner glow line at top -->
  <rect x="2" y="2" width="60" height="60" rx="12" ry="12"
        fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
</svg>
