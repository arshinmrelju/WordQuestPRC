<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Quest — Word Search</title>
    <meta name="description" content="Word Quest Word Search — English Department Carnival 2026">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Shared design system -->
    <link rel="stylesheet" href="style.css">
    <!-- Game-specific overrides -->
    <link rel="stylesheet" href="game.css">
</head>
<body class="executive-theme">

    <!-- Background dot grid (same as index.html) -->
    <div class="bg-grid-mesh" aria-hidden="true"></div>

    <div class="game-page-wrap">

        <!-- ── TOP BAR (matches index header aesthetic) ── -->
        <header class="game-top-bar animate-fade-in">
            <div class="top-bar-main">
                <!-- Player badge -->
                <div class="player-badge" id="player-badge">
                    <svg class="player-badge-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                    <span class="player-badge-name" id="player-name-display">Player</span>
                    <span class="player-badge-sep">|</span>
                    <span class="player-badge-dept" id="player-dept-display">—</span>
                </div>

                <!-- Logo — same emblem as index -->
                <div class="game-header-logo">
                    <div class="logo-emblem-sm">
                        <span class="logo-letter">W</span>
                        <span class="logo-letter logo-letter-accent">Q</span>
                    </div>
                    <div class="logo-text-group">
                        <h1 class="game-header-title">Word <span class="gold-text">Quest</span></h1>
                        <span class="game-header-sub">Word Search</span>
                    </div>
                </div>
            </div>

            <!-- Live stats bar -->
            <div class="game-stats-row">
                <div class="stat-capsule">
                    <span class="stat-capsule-label">Found</span>
                    <span class="stat-capsule-val" id="found-count">0 / 8</span>
                </div>
                <div class="stat-capsule stat-capsule-gold">
                    <span class="stat-capsule-label">Score</span>
                    <span class="stat-capsule-val gold-text" id="score-val">0</span>
                </div>
                <div class="stat-capsule stat-capsule-timer" id="timer-capsule">
                    <span class="stat-capsule-label">Time</span>
                    <span class="stat-capsule-val timer-mono" id="timer-val">05:00</span>
                </div>
            </div>
        </header>

        <!-- ── TIMER PROGRESS BAR ── -->
        <div class="timer-rail" role="progressbar" aria-label="Time remaining">
            <div class="timer-rail-fill" id="timer-bar-fill"></div>
        </div>

        <!-- ── MAIN CONTENT ── -->
        <main class="game-main">

            <!-- WORD LIST card (glass-card style) -->
            <section class="glass-card word-list-card animate-fade-in">
                <div class="wl-header">
                    <div class="card-icon card-icon-gold" aria-hidden="true">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                        </svg>
                    </div>
                    <p class="card-title">Find These Words</p>
                </div>
                <ul class="word-list" id="word-list"></ul>
            </section>

            <!-- GRID card (glass-card style) -->
            <section class="glass-card grid-card animate-fade-in">
                <div class="grid-card-header">
                    <div class="card-icon" aria-hidden="true">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
                            <rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
                        </svg>
                    </div>
                    <p class="card-title">Letter Grid</p>
                    <span class="grid-hint-pill">Click &amp; drag to select</span>
                </div>
                <div class="grid-wrapper">
                    <div class="grid" id="grid"></div>
                </div>
            </section>

        </main>

        <!-- ── FOOTER ── -->
        <footer class="footer animate-fade-in">
            <p>&copy; 2026 Word Quest &bull; <strong>English Department Carnival</strong></p>
        </footer>

    </div><!-- /game-page-wrap -->

    <!-- ════ OVERLAYS ════ -->

    <!-- End (win / time-up) -->
    <div class="overlay-backdrop hidden" id="overlay-end" role="dialog" aria-modal="true">
        <div class="glass-card overlay-dialog">
            <div class="overlay-trophy" id="end-emoji">🏆</div>
            <h2 class="overlay-title" id="end-title">You Found Them All!</h2>
            <p class="overlay-sub" id="end-sub"></p>

            <div class="score-showcase">
                <span class="score-showcase-num gold-text" id="score-result-num">0</span>
                <span class="score-showcase-label">total points</span>
            </div>

            <div class="btn-group">
                <button class="glass-btn btn-primary" onclick="WS.restart()">Play Again</button>
                <button class="glass-btn btn-secondary" onclick="WS.toggleOverlay()">Inspect Grid</button>
                <a href="index.html" class="glass-btn btn-secondary">Main Menu</a>
            </div>
        </div>
    </div>

    <!-- Floating button to bring back result modal when inspecting grid -->
    <button id="reopen-overlay-btn" class="glass-btn btn-primary reopen-overlay-fab hidden" onclick="WS.toggleOverlay()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        <span>Show Results</span>
    </button>

    <!-- Toast stack -->
    <div id="toast-area" class="toast-stack" aria-live="polite"></div>

    <script type="module" src="firebase-service.js"></script>
    <script src="game.js"></script>
</body>
</html>
